<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ScoutBuddy</title>
    <link rel="stylesheet" href="scoutInfo.css">
</head>

<body>

    <div class="container">

    <div class="left-panel">
        <h2>Team Search</h2>

        <input
            id="teamNumberInput"
            type="number"
            placeholder="Enter Team Number"
        >

        <button id="searchTeamBtn">
            Search Team
        </button>

        <p id="status">Ready</p>

        <div id="results"></div>
    </div>

   <div class="right-panel">

    <h2>Events</h2>

<select id="eventDropdown">
    <option value="">
        Search a team first...
    </option>
</select>
<div id="matchResults"></div>

</div>

</div>
<script type="module" src="js/scoutinfo.js"></script>
</body>

</html>
